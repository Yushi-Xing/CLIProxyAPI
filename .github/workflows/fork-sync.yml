name: Sync upstream and release

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Yushi-Xing/CLIProxyAPI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Configure merge author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Test merge safety and release decisions
        run: |
          python3 .github/scripts/test-merge-upstream.py
          python3 -B .github/scripts/test-fork-release.py
      - name: Prepare upstream merge
        id: merge
        run: bash .github/scripts/merge-upstream.sh
      - uses: actions/setup-go@v6
        if: steps.merge.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate merged code before pushing
        if: steps.merge.outputs.changed == 'true'
        run: |
          go test ./internal/translator/antigravity/... ./internal/translator/common -count=1
          go test ./internal/runtime/executor -run Antigravity -count=1
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/cli-proxy-api" ./cmd/server
          "$RUNNER_TEMP/cli-proxy-api" --help > "$RUNNER_TEMP/cli-proxy-api-help.txt" 2>&1
      - name: Commit and push validated merge
        if: steps.merge.outputs.changed == 'true'
        id: push
        env:
          UPSTREAM_REVISION: ${{ steps.merge.outputs.upstream_revision }}
        run: |
          git commit -m "chore: merge upstream main (${UPSTREAM_REVISION})"
          git push origin HEAD:main
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check whether current commit needs a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch origin --tags
          python3 -B .github/scripts/fork-release.py check
      - name: Build and publish unreleased commit
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          gh workflow run fork-release.yml --ref main -f "revision=$REVISION"
          printf '### Release build dispatched\n\nCommit: `%s`\n\nThe release workflow will validate this commit before publication.\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Report already published
        if: steps.release.outputs.needed == 'false'
        run: echo 'Current commit already has a complete published release; no build is needed.' >> "$GITHUB_STEP_SUMMARY"

name: Fork release (Linux amd64)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact commit SHA to validate and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Yushi-Xing/CLIProxyAPI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - name: Verify release commit belongs to fork main
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
      - name: Plan date-based release tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          # Use tooling from the workflow revision, including when releasing
          # an older commit that predates these scripts.
          git show "$WORKFLOW_REVISION:.github/scripts/fork-release.py" > "$RUNNER_TEMP/fork-release.py"
          git show "$WORKFLOW_REVISION:.github/scripts/test-fork-release.py" > "$RUNNER_TEMP/test-fork-release.py"
          python3 -B "$RUNNER_TEMP/test-fork-release.py"
          python3 -B "$RUNNER_TEMP/fork-release.py" plan
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Antigravity regression tests
        run: |
          go test ./internal/translator/antigravity/... ./internal/translator/common -count=1
          go test ./internal/runtime/executor -run Antigravity -count=1
      - name: Check plugin host and management support header
        run: |
          CGO_ENABLED=1 go test ./internal/pluginhost -count=1
          CGO_ENABLED=1 go test ./internal/api -run '^TestManagementResponseExposesPluginSupportHeaderForCORS$' -count=1
      - name: Build and package static binary
        id: build
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          tag="$TAG"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist/archive
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.Version=${tag} -X main.Commit=${revision} -X main.BuildDate=${built_at}" \
            -o dist/archive/cli-proxy-api ./cmd/server
          if readelf -l dist/archive/cli-proxy-api | grep -q 'Requesting program interpreter'; then
            echo "static binary must not require a dynamic interpreter" >&2
            exit 1
          fi
          dist/archive/cli-proxy-api --help > "$RUNNER_TEMP/cli-proxy-api-help.txt" 2>&1
          head -n 1 "$RUNNER_TEMP/cli-proxy-api-help.txt"
          cp LICENSE README.md README_CN.md config.example.yaml dist/archive/
          archive="CLIProxyAPI_${tag}_linux_amd64_no-plugin.tar.gz"
          tar -C dist/archive -czf "dist/$archive" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          (cd dist && sha256sum "$archive" > checksums.txt)
          printf 'tag=%s\nrevision=%s\n' "$tag" "$revision" >> "$GITHUB_OUTPUT"
      - name: Build and package plugin-enabled binary (GLIBC 2.17)
        env:
          TAG: ${{ steps.build.outputs.tag }}
          REVISION: ${{ steps.build.outputs.revision }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Tooling comes from this workflow even when building an older commit.
          git show "$WORKFLOW_REVISION:.github/scripts/build-fork-plugin-linux.sh" > "$RUNNER_TEMP/build-fork-plugin-linux.sh"
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$(go env GOROOT):/usr/local/go:ro" \
            -v "$(go env GOMODCACHE):/go/pkg/mod" \
            -v "$RUNNER_TEMP/build-fork-plugin-linux.sh:/build-fork-plugin-linux.sh:ro" \
            -e TAG -e REVISION -e BUILD_DATE \
            quay.io/pypa/manylinux2014_x86_64 \
            bash /build-fork-plugin-linux.sh
          (cd dist && sha256sum CLIProxyAPI_*.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.build.outputs.tag }}
          REVISION: ${{ steps.build.outputs.revision }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/fork-release-notes.md"
          printf 'Linux amd64 builds from commit `%s`.\n\n' "$REVISION" > "$notes"
          cat >> "$notes" <<'EOF'
          Includes the fork's Antigravity tool-image fix and any upstream changes merged into this commit.

          Antigravity converter and executor regression tests, plugin host tests, management support-header checks, compilation, linkage checks, and startup checks passed before publication.

          - `linux_amd64.tar.gz`: standard build with dynamic library plugin support and a GLIBC 2.17 baseline. Choose this build to use the plugin marketplace.
          - `linux_amd64_no-plugin.tar.gz`: static build for systems without compatible GLIBC. Dynamic library plugins are not supported.

          Verify your archive against `checksums.txt`. Updating the server remains a manual step.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            actual_revision="$(git rev-list -n 1 "$TAG")"
            if [[ "$actual_revision" != "$REVISION" ]]; then
              echo "existing release tag points to a different commit" >&2
              exit 1
            fi
          else
            gh release create "$TAG" --target "$REVISION" --title "$TAG" --notes-file "$notes" --draft
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          git fetch origin main --no-tags
          latest=false
          if [[ "$(git rev-parse origin/main)" == "$REVISION" ]]; then
            latest=true
          fi
          gh release edit "$TAG" --draft=false --latest="$latest"
          printf '### Published release\n\nhttps://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
